<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品圖庫</title>
<style>
  :root {
    --bg: #F7F6F3; --surface: #FFFFFF; --surface2: #F0EEE9;
    --border: #E2DED7; --text: #1A1916; --text-muted: #6B6760; --text-faint: #A39F99;
    --accent: #2563EB; --accent-bg: #EEF4FF; --accent-dark: #1D4ED8;
    --danger: #DC2626; --radius: 10px; --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; height: 56px; gap: 12px; position: sticky; top: 0; z-index: 100; }
  .header-logo { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
  .header-logo span { color: var(--accent); }
  .header-count { font-size: 12px; color: var(--text-faint); background: var(--surface2); padding: 3px 8px; border-radius: 20px; }
  .header-status { font-size: 12px; color: var(--text-faint); display: flex; align-items: center; gap: 5px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); }
  .status-dot.ok { background: #16A34A; }
  .status-dot.err { background: var(--danger); }
  .status-dot.loading { background: #F59E0B; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .header-actions { margin-left: auto; display: flex; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .btn:hover { background: var(--surface2); border-color: #C8C4BC; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent-dark); }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-danger { color: var(--danger); border-color: #FECACA; }
  .btn-danger:hover { background: #FEF2F2; }
  .btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  .layout { display: flex; height: calc(100vh - 56px); }
  .sidebar { width: 230px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; }
  .main { flex: 1; overflow-y: auto; padding: 20px 24px; }

  .sidebar-section { padding: 12px 0 4px; }
  .sidebar-label { font-size: 11px; font-weight: 600; color: var(--text-faint); letter-spacing: 0.06em; text-transform: uppercase; padding: 0 14px 6px; }
  .sidebar-item { display: flex; align-items: center; gap: 8px; padding: 6px 14px; cursor: pointer; color: var(--text-muted); font-size: 13px; transition: all 0.12s; border-left: 2px solid transparent; }
  .sidebar-item:hover { background: var(--surface2); color: var(--text); }
  .sidebar-item.active { background: var(--accent-bg); color: var(--accent); border-left-color: var(--accent); font-weight: 500; }
  .sidebar-item .count { margin-left: auto; font-size: 11px; background: #EEECEA; color: var(--text-faint); padding: 1px 6px; border-radius: 10px; }
  .sidebar-item.active .count { background: #DBEAFE; color: var(--accent); }
  .sidebar-divider { height: 1px; background: var(--border); margin: 4px 14px; }
  .cat-header { display: flex; align-items: center; gap: 6px; padding: 7px 14px 5px; cursor: pointer; color: var(--text-muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.12s; border-left: 2px solid transparent; }
  .cat-header:hover { background: var(--surface2); color: var(--text); }
  .cat-header.active { background: var(--accent-bg); color: var(--accent); border-left-color: var(--accent); }
  .cat-header .count { margin-left: auto; font-size: 11px; background: #EEECEA; color: var(--text-faint); padding: 1px 6px; border-radius: 10px; }
  .cat-header.active .count { background: #DBEAFE; color: var(--accent); }
  .cat-header .chevron { width: 12px; height: 12px; transition: transform 0.2s; flex-shrink: 0; }
  .cat-header.collapsed .chevron { transform: rotate(-90deg); }
  .sub-items.collapsed { display: none; }
  .sub-item { display: flex; align-items: center; padding: 5px 14px 5px 28px; cursor: pointer; color: var(--text-muted); font-size: 12px; transition: all 0.12s; border-left: 2px solid transparent; }
  .sub-item:hover { background: var(--surface2); color: var(--text); }
  .sub-item.active { background: var(--accent-bg); color: var(--accent); border-left-color: var(--accent); font-weight: 500; }
  .sub-item .count { margin-left: auto; font-size: 11px; background: #EEECEA; color: var(--text-faint); padding: 1px 6px; border-radius: 10px; }
  .sub-item.active .count { background: #DBEAFE; color: var(--accent); }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 320px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; width: 15px; height: 15px; }
  .search-input { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); font-size: 13px; color: var(--text); outline: none; }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
  .batch-bar { display: none; align-items: center; gap: 10px; background: var(--accent-bg); border: 1px solid #BFDBFE; border-radius: var(--radius-sm); padding: 7px 12px; font-size: 13px; color: var(--accent); font-weight: 500; }
  .batch-bar.show { display: flex; }
  .toolbar-right { margin-left: auto; display: flex; gap: 8px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: all 0.15s; position: relative; }
  .card:hover { border-color: #C8C4BC; box-shadow: 0 2px 12px rgba(0,0,0,0.08); transform: translateY(-1px); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,0.2); }
  .card-checkbox { position: absolute; top: 8px; left: 8px; z-index: 2; }
  .card-checkbox input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
  .card-img-wrap { aspect-ratio: 1; overflow: hidden; background: var(--surface2); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .card-img-wrap img { width: 100%; height: 100%; object-fit: contain; padding: 8px; transition: transform 0.2s; }
  .card:hover .card-img-wrap img { transform: scale(1.04); }
  .no-img { color: var(--text-faint); font-size: 11px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .no-img svg { width: 28px; height: 28px; opacity: 0.35; }
  .card-body { padding: 9px 11px; border-top: 1px solid var(--border); }
  .card-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 7px; min-height: 18px; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 500; }
  .tag-main { background: #DBEAFE; color: #1D4ED8; }
  .tag-sub { background: #EEECEA; color: #4A4743; }
  .card-actions { display: flex; gap: 5px; }
  .card-btn { flex: 1; padding: 5px 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-muted); font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px; transition: all 0.12s; }
  .card-btn:hover { background: var(--surface2); color: var(--text); }
  .card-btn.dl:hover { background: var(--accent-bg); color: var(--accent); border-color: #BFDBFE; }
  .card-btn svg { width: 12px; height: 12px; }

  .empty { text-align: center; padding: 56px 24px; grid-column: 1/-1; }
  .empty svg { width: 44px; height: 44px; margin: 0 auto 14px; opacity: 0.25; display: block; }
  .empty h3 { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .empty p { font-size: 13px; color: var(--text-faint); }

  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border-radius: 14px; width: 100%; overflow: hidden; max-height: 90vh; display: flex; flex-direction: column; }
  .modal.preview-modal { max-width: 680px; }
  .modal.form-modal { max-width: 480px; }
  .modal-header { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); gap: 12px; }
  .modal-title { font-size: 15px; font-weight: 600; flex: 1; }
  .modal-close { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); flex-shrink: 0; }
  .modal-close:hover { background: var(--surface2); }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
  .modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; align-items: center; }

  .preview-img-wrap { background: var(--surface2); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; min-height: 260px; margin-bottom: 16px; overflow: hidden; }
  .preview-img-wrap img { max-width: 100%; max-height: 380px; object-fit: contain; }
  .preview-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .info-field { background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 12px; }
  .info-label { font-size: 11px; color: var(--text-faint); margin-bottom: 3px; }
  .info-value { font-size: 13px; font-weight: 500; word-break: break-all; }

  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; display: block; }
  .form-input, .form-select { width: 100%; padding: 8px 11px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); font-size: 13px; color: var(--text); outline: none; }
  .form-input:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
  .form-hint { font-size: 11px; color: var(--text-faint); margin-top: 4px; }

  .tag-picker { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; background: var(--surface2); max-height: 200px; overflow-y: auto; }
  .tag-picker-group { margin-bottom: 10px; }
  .tag-picker-group:last-child { margin-bottom: 0; }
  .tag-picker-label { font-size: 11px; font-weight: 600; color: var(--text-faint); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px; }
  .tag-options { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag-option { padding: 3px 10px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; cursor: pointer; background: var(--surface); color: var(--text-muted); transition: all 0.12s; user-select: none; }
  .tag-option:hover { border-color: var(--accent); color: var(--accent); }
  .tag-option.selected { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 500; }

  .img-preview-box { width: 100%; aspect-ratio: 2.5; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface2); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .img-preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; padding: 8px; }
  .img-placeholder { font-size: 12px; color: var(--text-faint); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .img-placeholder svg { width: 26px; height: 26px; opacity: 0.35; }
  .img-replace { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.5); color: #fff; font-size: 11px; padding: 4px; text-align: center; opacity: 0; transition: opacity 0.15s; }
  .img-preview-box:hover .img-replace { opacity: 1; }
  .img-preview-box input[type=file] { display: none; }

  /* Sheet sync banner */
  .sync-banner { background: var(--accent-bg); border: 1px solid #BFDBFE; border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--accent); }
  .sync-banner svg { width: 16px; height: 16px; flex-shrink: 0; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: #fff; padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13px; z-index: 999; opacity: 0; transform: translateY(8px); transition: all 0.2s; pointer-events: none; max-width: 300px; }
  .toast.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 640px) { .sidebar { display: none; } }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">商品<span>圖庫</span></div>
  <div class="header-count" id="headerCount">0 張圖片</div>
  <div class="header-status" id="headerStatus">
    <div class="status-dot loading" id="statusDot"></div>
    <span id="statusText">連線中…</span>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="syncFromSheet()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      同步圖庫
    </button>
    <button class="btn btn-primary" onclick="openAddImage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新增圖片
    </button>
  </div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="searchInput" placeholder="搜尋圖片名稱…" oninput="renderGrid()">
      </div>
      <div class="toolbar-right">
        <div class="batch-bar" id="batchBar">
          <span id="batchCount">0 張已選</span>
          <button class="btn btn-primary btn-sm" onclick="batchDownload()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            批次下載
          </button>
          <button class="btn btn-sm" onclick="clearSelection()">取消</button>
        </div>
      </div>
    </div>
    <div class="grid" id="imageGrid"></div>
  </div>
</div>

<!-- Preview Modal -->
<div class="modal-bg" id="previewModal">
  <div class="modal preview-modal">
    <div class="modal-header">
      <div class="modal-title" id="previewTitle"></div>
      <button class="modal-close" onclick="closeModal('previewModal')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="preview-img-wrap"><img id="previewImg" src="" alt=""></div>
      <div class="preview-info" id="previewInfo"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('previewModal')">關閉</button>
      <button class="btn btn-primary" id="previewDlBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        下載
      </button>
    </div>
  </div>
</div>

<!-- Add/Edit Image Modal -->
<div class="modal-bg" id="imageModal">
  <div class="modal form-modal">
    <div class="modal-header">
      <div class="modal-title" id="imageModalTitle">新增圖片</div>
      <button class="modal-close" onclick="closeModal('imageModal')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label class="form-label">圖片名稱</label>
        <input class="form-input" id="fName" placeholder="例：握把正面">
      </div>
      <div class="form-group">
        <label class="form-label">所屬分類（可多選）</label>
        <div class="tag-picker" id="tagPicker"></div>
      </div>
      <div class="form-group">
        <label class="form-label">圖片預覽網址</label>
        <input class="form-input" id="fUrl" placeholder="貼上 Google Drive 預覽連結" oninput="handleUrlInput(this.value)">
        <div class="form-hint">格式：https://drive.google.com/uc?export=view&id=...</div>
      </div>
      <div class="form-group">
        <label class="form-label">下載網址</label>
        <input class="form-input" id="fDlUrl" placeholder="貼上 Google Drive 下載連結">
        <div class="form-hint">格式：https://drive.google.com/uc?export=download&id=...</div>
      </div>
      <div class="form-group">
        <label class="form-label">備註</label>
        <input class="form-input" id="fNote" placeholder="部位說明、案件編號等">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="deleteBtn" style="margin-right:auto" onclick="deleteImage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        刪除
      </button>
      <button class="btn" onclick="closeModal('imageModal')">取消</button>
      <button class="btn btn-primary" onclick="saveImage()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const SHEET_ID = '1uaqlHAn9ytPBFR4ryd-JYBc9-cnI9NDlyDHBcaJ7dt8';
const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&sheet=%E7%B3%BB%E7%B5%B1%E6%B8%AC%E8%A9%A6_AK`;

const IMAGES_KEY = 'imgLib_images_v3';
const CATS_KEY   = 'imgLib_cats_v1';

const DEFAULT_CATS = [
  { id: 'c1', name: 'Blinds', subs: [
    {id:'s1',name:'AMXQAWTX'},{id:'s2',name:'AMXQAWTA'},{id:'s3',name:'AMXQAWTB'},
    {id:'s4',name:'QJ'},{id:'s5',name:'AMXQJ'},{id:'s6',name:'QK'},
    {id:'s7',name:'1C'},{id:'s8',name:'1D'},{id:'s9',name:'QH'}
  ]},
  { id: 'c2', name: 'Cellular Shades', subs: [
    {id:'s10',name:'AMXQM'},{id:'s11',name:'QM'},{id:'s12',name:'QE'},
    {id:'s13',name:'QC'},{id:'s14',name:'AMXQC'},{id:'s15',name:'QN'},
    {id:'s16',name:'QG'},{id:'s17',name:'QQ'},{id:'s18',name:'QF'},
    {id:'s19',name:'AMXQP'},{id:'s20',name:'QD'},{id:'s21',name:'AMXQD'},
    {id:'s22',name:'1H'},{id:'s23',name:'1G'},{id:'s24',name:'3Q'},
    {id:'s25',name:'3S'},{id:'s26',name:'3T'},{id:'s27',name:'3U/3V'}
  ]},
  { id: 'c3', name: 'No Tool', subs: [
    {id:'s28',name:'EC'},{id:'s29',name:'ED'},{id:'s30',name:'EM'},
    {id:'s31',name:'EN'},{id:'s32',name:'EZ Grip'},{id:'s33',name:'EZ Fit'},
    {id:'s34',name:'Magnet Cellular'}
  ]}
];

let images = [];
let cats = [];
let filterState = { type: 'all', catId: null, subId: null };
let selectedIds = new Set();
let selectedTags = new Set();
let collapsedCats = new Set();

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function load() {
  try { images = JSON.parse(localStorage.getItem(IMAGES_KEY)) || []; } catch { images = []; }
  try { cats = JSON.parse(localStorage.getItem(CATS_KEY)) || DEFAULT_CATS; } catch { cats = DEFAULT_CATS; }
  if (!localStorage.getItem(CATS_KEY)) localStorage.setItem(CATS_KEY, JSON.stringify(DEFAULT_CATS));
}

function saveLocal() {
  try { localStorage.setItem(IMAGES_KEY, JSON.stringify(images)); } catch(e) { showToast('本機儲存失敗'); }
}

// ── Sync from Google Sheet ────────────────────────────────────────────────────
async function syncFromSheet() {
  setStatus('loading', '同步中…');
  try {
    const res = await fetch(SHEET_CSV_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const lines = text.trim().split('\n');
    // Skip header row
    const dataLines = lines.slice(1);
    const newImages = [];
    dataLines.forEach(line => {
      if (!line.trim()) return;
      // Parse CSV properly handling quoted fields
      const cols = parseCSVLine(line);
      const name    = (cols[0] || '').trim();
      const catName = (cols[1] || '').trim();
      const subName = (cols[2] || '').trim();
      const dlUrl   = (cols[3] || '').trim();
      const viewUrl = (cols[4] || '').trim();
      if (!name) return;

      const cat = cats.find(c => c.name === catName);
      const sub = cat ? cat.subs.find(s => s.name === subName) : null;
      const existing = images.find(i => i.dlUrl === dlUrl && dlUrl);
      if (existing) {
        newImages.push(existing);
      } else {
        newImages.push({
          id: uid(), name,
          cats: cat ? [cat.id] : [],
          subs: sub ? [sub.id] : [],
          url: viewUrl, dlUrl: dlUrl, note: ''
        });
      }
    });
    images = newImages;
    saveLocal(); render();
    setStatus('ok', `已同步 ${images.length} 張`);
    showToast(`同步完成，共 ${images.length} 張圖片`);
  } catch(e) {
    setStatus('err', '同步失敗');
    showToast('同步失敗：' + e.message);
    console.error(e);
  }
}

function parseCSVLine(line) {
  const result = [];
  let cur = '';
  let inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
      else inQuote = !inQuote;
    } else if (ch === ',' && !inQuote) {
      result.push(cur); cur = '';
    } else {
      cur += ch;
    }
  }
  result.push(cur);
  return result;
}

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  dot.className = 'status-dot ' + state;
  txt.textContent = text;
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function countForCat(catId) { return images.filter(i => i.cats && i.cats.includes(catId)).length; }
function countForSub(subId) { return images.filter(i => i.subs && i.subs.includes(subId)).length; }

function renderSidebar() {
  let html = `<div class="sidebar-section">
    <div class="sidebar-label">篩選</div>
    <div class="sidebar-item ${filterState.type==='all'?'active':''}" onclick="setFilter('all')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      全部圖片 <span class="count">${images.length}</span>
    </div>
    <div class="sidebar-item ${filterState.type==='uncat'?'active':''}" onclick="setFilter('uncat')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      未分類 <span class="count">${images.filter(i=>!i.subs||!i.subs.length).length}</span>
    </div>
  </div><div class="sidebar-divider"></div>`;

  cats.forEach(cat => {
    const collapsed = collapsedCats.has(cat.id);
    const catActive = filterState.type==='cat' && filterState.catId===cat.id;
    html += `<div class="cat-header ${catActive?'active':''} ${collapsed?'collapsed':''}" onclick="toggleCat('${cat.id}')">
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      ${cat.name}<span class="count">${countForCat(cat.id)}</span>
    </div>
    <div class="sub-items ${collapsed?'collapsed':''}">`;
    cat.subs.forEach(sub => {
      const subActive = filterState.type==='sub' && filterState.subId===sub.id;
      html += `<div class="sub-item ${subActive?'active':''}" onclick="setFilter('sub','${cat.id}','${sub.id}')">
        ${sub.name}<span class="count">${countForSub(sub.id)}</span>
      </div>`;
    });
    html += `</div>`;
  });

  document.getElementById('sidebar').innerHTML = html;
}

function setFilter(type, catId=null, subId=null) {
  filterState = { type, catId, subId };
  renderSidebar(); renderGrid();
}

function toggleCat(catId) {
  if (collapsedCats.has(catId)) collapsedCats.delete(catId); else collapsedCats.add(catId);
  filterState = { type: 'cat', catId, subId: null };
  renderSidebar(); renderGrid();
}

// ── Grid ──────────────────────────────────────────────────────────────────────
function renderGrid() {
  document.getElementById('headerCount').textContent = `${images.length} 張圖片`;
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let filtered = images.filter(img => {
    let pass = true;
    if (filterState.type==='cat') pass = img.cats && img.cats.includes(filterState.catId);
    else if (filterState.type==='sub') pass = img.subs && img.subs.includes(filterState.subId);
    else if (filterState.type==='uncat') pass = !img.subs || !img.subs.length;
    if (q) pass = pass && img.name.toLowerCase().includes(q);
    return pass;
  });

  const grid = document.getElementById('imageGrid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <h3>${filterState.type==='all'&&!q?'還沒有圖片':'找不到圖片'}</h3>
      <p>${filterState.type==='all'&&!q?'點右上角「同步圖庫」從 Google Sheet 載入':'換個關鍵字或分類試試'}</p>
    </div>`; return;
  }

  grid.innerHTML = filtered.map(img => {
    const subNames = (img.subs||[]).map(sid => { for(const c of cats){const s=c.subs.find(x=>x.id===sid);if(s)return s.name;} return null; }).filter(Boolean);
    const catNames = (img.cats||[]).map(cid => { const c=cats.find(x=>x.id===cid); return c?c.name:null; }).filter(Boolean);
    const tagsHtml = [...catNames.map(n=>`<span class="tag tag-main">${n}</span>`), ...subNames.slice(0,2).map(n=>`<span class="tag tag-sub">${n}</span>`), subNames.length>2?`<span class="tag tag-sub">+${subNames.length-2}</span>`:''].join('');

    return `<div class="card ${selectedIds.has(img.id)?'selected':''}" id="card-${img.id}">
      <div class="card-checkbox"><input type="checkbox" ${selectedIds.has(img.id)?'checked':''} onclick="toggleSelect(event,'${img.id}')"></div>
      <div class="card-img-wrap" onclick="openPreview('${img.id}')">
        ${img.url
          ? `<img src="${img.url}" alt="${img.name}" style="width:100%;height:100%;object-fit:contain;padding:8px" onerror="this.style.display='none'">`
          : `<div class="no-img"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>未設定圖片</span></div>`}
      </div>
      <div class="card-body">
        <div class="card-name" title="${img.name}">${img.name}</div>
        <div class="card-tags">${tagsHtml}</div>
        <div class="card-actions">
          <button class="card-btn" onclick="openEditImage('${img.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>編輯</button>
          <button class="card-btn dl" onclick="downloadImage('${img.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下載</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function render() { renderSidebar(); renderGrid(); }

// ── Selection & Download ──────────────────────────────────────────────────────
function toggleSelect(e, id) {
  e.stopPropagation();
  if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  document.getElementById('card-'+id)?.classList.toggle('selected', selectedIds.has(id));
  updateBatchBar();
}
function updateBatchBar() {
  document.getElementById('batchBar').classList.toggle('show', selectedIds.size>0);
  document.getElementById('batchCount').textContent = `${selectedIds.size} 張已選`;
}
function clearSelection() { selectedIds.clear(); renderGrid(); updateBatchBar(); }

function downloadImage(id) {
  const img = images.find(x=>x.id===id); if(!img) return;
  const url = img.dlUrl || img.url; if(!url) { showToast('此圖片未設定下載連結'); return; }
  fetch(url).then(r=>r.blob()).then(blob=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = img.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }).catch(()=>{
    const a = document.createElement('a'); a.href=url; a.download=img.name; a.target='_blank';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });
  showToast('下載：'+img.name);
}

function batchDownload() {
  let i=0; selectedIds.forEach(id=>{ setTimeout(()=>downloadImage(id), i*300); i++; });
  showToast(`批次下載 ${i} 張`); clearSelection();
}

// ── Preview ───────────────────────────────────────────────────────────────────
function openPreview(id) {
  const img = images.find(x=>x.id===id); if(!img) return;
  document.getElementById('previewTitle').textContent = img.name;
  document.getElementById('previewImg').src = img.url || '';
  const subNames = (img.subs||[]).map(sid=>{for(const c of cats){const s=c.subs.find(x=>x.id===sid);if(s)return s.name;}return null;}).filter(Boolean);
  document.getElementById('previewInfo').innerHTML = `
    ${subNames.length?`<div class="info-field" style="grid-column:1/-1"><div class="info-label">分類</div><div class="info-value" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:2px">${subNames.map(n=>`<span class="tag tag-sub" style="font-size:12px">${n}</span>`).join('')}</div></div>`:''}
    ${img.note?`<div class="info-field" style="grid-column:1/-1"><div class="info-label">備註</div><div class="info-value">${img.note}</div></div>`:''}
  `;
  document.getElementById('previewDlBtn').onclick = ()=>downloadImage(id);
  openModal('previewModal');
}

// ── Add / Edit Image ──────────────────────────────────────────────────────────
function buildTagPicker() {
  document.getElementById('tagPicker').innerHTML = cats.map(cat=>`
    <div class="tag-picker-group">
      <div class="tag-picker-label">${cat.name}</div>
      <div class="tag-options">${cat.subs.map(sub=>`
        <div class="tag-option ${selectedTags.has(sub.id)?'selected':''}" onclick="toggleTag(this,'${sub.id}')" data-id="${sub.id}">${sub.name}</div>
      `).join('')}</div>
    </div>`).join('');
}

function toggleTag(el, subId) {
  if (selectedTags.has(subId)) { selectedTags.delete(subId); el.classList.remove('selected'); }
  else { selectedTags.add(subId); el.classList.add('selected'); }
}

function syncCats() {
  const implied = new Set();
  selectedTags.forEach(sid => { cats.forEach(c=>{ if(c.subs.find(s=>s.id===sid)) implied.add(c.id); }); });
  return Array.from(implied);
}

function openAddImage() {
  document.getElementById('imageModalTitle').textContent = '新增圖片';
  document.getElementById('editId').value = '';
  document.getElementById('fName').value = '';
  document.getElementById('fUrl').value = '';
  document.getElementById('fDlUrl').value = '';
  document.getElementById('fNote').value = '';
  document.getElementById('deleteBtn').style.display = 'none';
  selectedTags = new Set();
  buildTagPicker();
  openModal('imageModal');
  setTimeout(()=>document.getElementById('fName').focus(), 100);
}

function openEditImage(id) {
  const img = images.find(x=>x.id===id); if(!img) return;
  document.getElementById('imageModalTitle').textContent = '編輯圖片';
  document.getElementById('editId').value = id;
  document.getElementById('fName').value = img.name;
  document.getElementById('fUrl').value = img.url || '';
  document.getElementById('fDlUrl').value = img.dlUrl || '';
  document.getElementById('fNote').value = img.note || '';
  document.getElementById('deleteBtn').style.display = 'inline-flex';
  selectedTags = new Set(img.subs || []);
  buildTagPicker();
  openModal('imageModal');
}

function saveImage() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { showToast('請輸入圖片名稱'); return; }
  const id = document.getElementById('editId').value;
  const data = {
    name,
    subs: Array.from(selectedTags),
    cats: syncCats(),
    url: document.getElementById('fUrl').value.trim(),
    dlUrl: document.getElementById('fDlUrl').value.trim(),
    note: document.getElementById('fNote').value.trim()
  };
  if (id) {
    const i = images.findIndex(x=>x.id===id);
    if (i>-1) images[i] = {...images[i], ...data};
    showToast('已更新');
  } else {
    images.push({id: uid(), ...data});
    showToast('已新增');
  }
  saveLocal(); closeModal('imageModal'); render();
}

function deleteImage() {
  const id = document.getElementById('editId').value; if(!id) return;
  const img = images.find(x=>x.id===id);
  if (!confirm(`確定刪除「${img?.name}」？`)) return;
  images = images.filter(x=>x.id!==id);
  saveLocal(); closeModal('imageModal'); render();
  showToast('已刪除');
}

function handleUrlInput(val) {}

// ── Modals ────────────────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-bg').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 2500);
}

// ── Init ──────────────────────────────────────────────────────────────────────
load();
render();
// Auto sync on load
syncFromSheet();
</script>
